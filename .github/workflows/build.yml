name: Build Pardus Linux App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Proje Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Flet Kütüphanesini Yükle
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Linux Uygulamasını Derle
        run: |
          flet build linux --yes

      - name: Derlenen Dosyayı İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: Pardus-Linux-App
          path: build/linux/
