name: Build Pardus AppImage

on:
  push:
    branches: [ main ]  # main dalına kod push ettiğinde çalışır
  workflow_dispatch:     # GitHub üzerinden butona basarak elle başlatmanı sağlar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Proje Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Flet Kütüphanesini Yükle
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: AppImage Derle
        run: |
          flet build appimage

      - name: Derlenen Dosyayı İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: Pardus-AppImage
          path: build/linux/
