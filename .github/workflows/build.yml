name: Build Pardus AppImage

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Proje Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Sabitle (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Linux Bağımlılıklarını Yükle
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev wget file squashfs-tools imagemagick

      - name: Flet Kütüphanesini Yükle
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Linux Derlemesi Yap
        run: |
          flet build linux --yes

      - name: AppImage Paketi Oluştur
        run: |
          # Güncel appimagetool aracını indir
          wget -O appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract

          # AppDir yapısını oluştur ve derlenen dosyaları kopyala
          mkdir -p AppDir/usr/bin
          cp -r build/linux/* AppDir/usr/bin/

          # AppRun başlatıcı dosyasını oluştur
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/Pear-stek-Kutusu" "$@"
          EOF
          chmod +x AppDir/AppRun

          # Desktop entegrasyon dosyası
          cat << 'EOF' > AppDir/pear.desktop
          [Desktop Entry]
          Name=Pear-stek-Kutusu
          Exec=Pear-stek-Kutusu
          Icon=pear
          Type=Application
          Categories=Utility;
          EOF

          # Geçici ikon oluştur
          convert -size 64x64 xc:green AppDir/pear.png

          # AppImage dosyasını paketle
          ARCH=x86_64 ./squashfs-root/AppRun AppDir Pear-stek-Kutusu.AppImage

      - name: AppImage Dosyasını İndirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: Pear-stek-Kutusu-AppImage
          path: Pear-stek-Kutusu.AppImage
